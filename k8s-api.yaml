# Step 8: the pipeline as a REST API on Kubernetes. Apply it on top of k8s.yaml:
#   kubectl apply -f k8s-api.yaml
#   kubectl port-forward svc/upload 3002:3001        then send images to http://localhost:3002
apiVersion: apps/v1
kind: Deployment
metadata: {name: upload}
spec:
  replicas: 1
  selector: {matchLabels: {app: upload}}
  template:
    metadata: {labels: {app: upload}}
    spec:
      containers:
        - name: upload
          image: sem-pipeline:1.0            # the same image as the pipeline Job
          imagePullPolicy: Never
          command: ["bentoml", "serve", "api:SemPipeline", "--port", "3001"]
          env:                               # the database settings from the Secret db-credentials
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_PASSWORD}}}
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_DB}}}
            - {name: DATABASE_URL, value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)"}
            - {name: CLASSIFIER_URL, value: "http://classifier:3000"}
          ports: [{containerPort: 3001}]
          readinessProbe:                    # no request before the service is up
            httpGet: {path: /readyz, port: 3001}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: upload}
spec:
  selector: {app: upload}
  ports: [{port: 3001}]
